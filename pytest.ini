# Arquivo de configuração do pytest (lido automaticamente ao rodar "pytest" na raiz).
[pytest]
# Adiciona a pasta "src" ao caminho de importação, para que os testes
# consigam fazer "from frete import ..." sem precisar de __init__.py ou pacotes.
pythonpath = src
# Diz ao pytest para procurar testes apenas dentro da pasta "tests".
testpaths = tests
